[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webx"
version = "0.1.0"
description = "Webx — a voice-controlled AI browser agent for privacy, navigation, and cross-tab orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Webx" }]
dependencies = [
  "playwright>=1.45",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
webx = "webx.cli:main"

[tool.setuptools.packages.find]
include = ["webx*"]

[tool.setuptools.package-data]
webx = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
